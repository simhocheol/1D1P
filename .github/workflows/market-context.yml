name: Market context
on:
  workflow_dispatch:
  schedule:
    # Daily, after FRED posts the previous day's Treasury and VIX values.
    - cron: '30 22 * * *'
permissions:
  contents: write
concurrency:
  group: market-context
  cancel-in-progress: false
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect long-run market context
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/collect_context.mjs
      - name: Collect money and attention signals
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPACA_CREDENTIALS_JSON: ${{ secrets.ALPACA_CREDENTIALS_JSON }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/collect_flows.mjs
      - name: Commit context
        run: |
          git add public/data/context.json
          if [ -f public/data/flows.json ]; then git add public/data/flows.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name simhocheol
          git config user.email 42663762+simhocheol@users.noreply.github.com
          git commit -m 'Update market context'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
