name: Market context
on:
  workflow_dispatch:
  schedule:
    # Daily, after FRED posts the previous day's Treasury and VIX values.
    - cron: '30 22 * * *'
permissions:
  contents: write
concurrency:
  group: market-context
  cancel-in-progress: false
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect long-run market context
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/collect_context.mjs
      - name: Commit context
        run: |
          git add public/data/context.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name simhocheol
          git config user.email 42663762+simhocheol@users.noreply.github.com
          git commit -m 'Update market context'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
