name: Market pulse
on:
  # cron-job.org dispatches this hourly with no inputs. force=true records even while the market is closed.
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
  schedule:
    # Backup only; GitHub often skips scheduled runs. The script ignores runs within 40 minutes of the last pulse.
    - cron: '50 * * * *'
permissions:
  contents: write
concurrency:
  group: market-pulse
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect market pulse
        env:
          ALPACA_CREDENTIALS_JSON: ${{ secrets.ALPACA_CREDENTIALS_JSON }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/collect_pulse.mjs ${{ inputs.force && '--force' || '' }}
      - name: Commit pulse history
        run: |
          git add public/data/pulse
          if git diff --cached --quiet; then exit 0; fi
          git config user.name simhocheol
          git config user.email 42663762+simhocheol@users.noreply.github.com
          git commit -m 'Update market pulse'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
