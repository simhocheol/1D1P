name: Collect official data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: official-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect at 09 and 17 Eastern, respecting DST
        id: collection
        continue-on-error: true
        run: python scripts/collect_official.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - name: Check whether collection slot ran
        id: slot
        run: |
          if git diff --quiet -- public/data/official-feed.json; then
            echo 'collected=false' >> "$GITHUB_OUTPUT"
          else
            echo 'collected=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm test
      - run: npm run test:collector
      - run: npm run build
      - name: Verify registered Alpaca market-data credentials
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.collected == 'true'
        id: alpaca
        continue-on-error: true
        env:
          ALPACA_CREDENTIALS_JSON: ${{ secrets.ALPACA_CREDENTIALS_JSON }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node scripts/check_alpaca.mjs
      - name: Collect FRED macro series
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.collected == 'true'
        id: fred
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/collect_fred.mjs
      - name: Collect SEC EDGAR filings
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.collected == 'true'
        id: edgar
        continue-on-error: true
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/collect_edgar.mjs
      - name: Restore shared report archive
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.collected == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p private-market/archive
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=report-archive&per_page=20" --jq '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id // empty')
          if [ -n "$id" ]; then gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$RUNNER_TEMP/archive.zip" && unzip -o -q "$RUNNER_TEMP/archive.zip" -d private-market/archive; fi
          ls private-market/archive | wc -l
      - name: Collect market universe and private bars
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.collected == 'true'
        id: market
        continue-on-error: true
        env:
          ALPACA_CREDENTIALS_JSON: ${{ secrets.ALPACA_CREDENTIALS_JSON }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/collect_market.mjs
      - name: Collect S&P 500 earnings calendar
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.collected == 'true'
        id: earnings
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/collect_earnings.mjs
      - uses: actions/upload-artifact@v4
        if: steps.market.outcome == 'success' || steps.market.outcome == 'failure'
        with:
          name: market-data
          path: private-market/market.enc
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.market.outcome == 'success' || steps.market.outcome == 'failure'
        with:
          name: report-archive
          path: private-market/archive/
          retention-days: 90
          if-no-files-found: ignore
      - name: Commit collected data for Git-integrated Vercel deployment
        run: |
          git add public/data/official-feed.json public/data/market-connection.json
          if [ -f public/data/universe.json ]; then git add public/data/universe.json; fi
          if [ -f public/data/earnings.json ]; then git add public/data/earnings.json; fi
          if [ -d public/data/reports ]; then git add public/data/reports; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name simhocheol
          git config user.email 42663762+simhocheol@users.noreply.github.com
          git commit -m 'Update official feed records'
          git push origin HEAD:main
      - name: Surface partial collection failures
        if: steps.collection.outcome == 'failure' || steps.alpaca.outcome == 'failure' || steps.market.outcome == 'failure' || steps.earnings.outcome == 'failure' || steps.fred.outcome == 'failure' || steps.edgar.outcome == 'failure'
        run: exit 1
