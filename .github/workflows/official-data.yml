name: Collect official data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
concurrency:
  group: official-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect at 09 and 17 Eastern, respecting DST
        id: collection
        continue-on-error: true
        run: python scripts/collect_official.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm test
      - run: npm run test:collector
      - run: npm run build
      - name: Commit collected data for Git-integrated Vercel deployment
        run: |
          git add public/data/official-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name simhocheol
          git config user.email 42663762+simhocheol@users.noreply.github.com
          git commit -m 'Update official feed records'
          git push origin HEAD:main
      - name: Surface partial collection failures
        if: steps.collection.outcome == 'failure'
        run: exit 1
